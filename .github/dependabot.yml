# Dependabot version updates: one weekly digest on Monday at noon Eastern,
# one minor+patch PR, with a 7-day cooldown before a new release is proposed.
# Security alerts/updates are separate and are enabled in Settings → Advanced
# Security, not here.
version: 2
updates:
  # Application + build/test dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:00"
      # Without a timezone GitHub reads `time` as UTC (8 am Eastern). Noon
      # Eastern lands the digest in the owner's working day.
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Don't open bump PRs for releases younger than 7 days, so a compromised
    # or broken release has a week to be caught and yanked before we see it.
    # Applies to version updates only — security updates are NOT delayed.
    cooldown:
      default-days: 7
    # Majors this repo can't take yet. Each one fails `npm ci` (ERESOLVE) or
    # the build, and drags down whatever group it lands in. Only the blocked
    # major is skipped: patches and minors on the current line keep coming,
    # including security fixes. Note: ignore rules also apply to Dependabot
    # security PRs; Dependabot alerts (Security tab) and `npm audit` are
    # unaffected. The weekly repo review checks the blockers every Monday and
    # says when an entry can be removed.
    ignore:
      # TypeScript 7: typescript-eslint only supports TypeScript < 6.1.
      # TypeScript 6 is still allowed.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # Security fixes: every minor/patch security fix in one PR. A security
      # fix that needs a MAJOR upgrade is left out of this group on purpose, so
      # it arrives as its own PR instead of holding the other fixes hostage
      # (a CVE fix once sat behind a Sanity major in one combined PR).
      security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      # Routine updates: ALL minor and patch version updates in one weekly PR.
      # These are the low-risk ones; one PR means one CI run and no rebase
      # cascade between sibling PRs.
      minor-and-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      # Majors: never mixed with the routine PR. Families that must move
      # together stay grouped; any other major arrives as its own PR so it can
      # be read and judged on its own. (Order matters: a package lands in the
      # FIRST group it matches.)
      react-major:
        update-types: ["major"]
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      rollup-major:
        update-types: ["major"]
        patterns:
          - "rollup"
          - "rollup-plugin-*"
          - "@rollup/*"
          - "tslib"
      dev-tooling-major:
        update-types: ["major"]
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
          - "typescript"
          - "prettier"
          - "vitest"
          - "@vitest/*"

  # Keep the GitHub Actions used in CI patched (a common supply-chain vector).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "12:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    groups:
      # Batch all action bumps into a single weekly PR rather than one each.
      actions:
        patterns:
          - "*"
